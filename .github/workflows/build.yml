name: Build Kernel GTA4XLWIFI AOSP NoKSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: "🚧 Build gta4xlwifi AOSP NoKSU"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            flex \
            libssl-dev \
            python3 \
            python-is-python3 \
            libarchive-tools

      - name: Setup toolchain
        run: |
          wget "$(curl -s https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt)" -O "weebx-clang.tar.gz"
          rm -rf clang toolchain && mkdir toolchain && tar -xvf weebx-clang.tar.gz -C toolchain && rm -rf weebx-clang.tar.gz

      - name: Build kernel
        run: |
          python build_kernel.py --target=gta4xlwifi --aosp --no-ksu

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: "Grass-gta4xlwifi-AOSP-NoKSU-Image"
          path: out/arch/arm64/boot/Image
